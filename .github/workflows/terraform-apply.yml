name: Terraform apply

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: production

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5

      - name: Initialize remote state
        run: |
          make terraform-init-gcs \
            GCS_BUCKET="${{ vars.TF_STATE_BUCKET }}" \
            GCS_PREFIX="${{ vars.TF_STATE_PREFIX }}" \
            TF_INIT_FLAGS="-input=false"

      - name: Create saved plan
        run: |
          terraform -chdir=terraform plan \
            -input=false \
            -out=apply.tfplan

      - name: Apply saved plan
        run: terraform -chdir=terraform apply -input=false apply.tfplan
