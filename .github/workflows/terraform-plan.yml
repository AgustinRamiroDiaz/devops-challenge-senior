name: Terraform plan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    # Forks still run the credential-free checks workflow, but cannot read the
    # remote state or exchange a GitHub token for Google Cloud credentials.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5

      - name: Initialize remote state
        run: |
          make terraform-init-gcs \
            GCS_BUCKET="${{ vars.TF_STATE_BUCKET }}" \
            GCS_PREFIX="${{ vars.TF_STATE_PREFIX }}" \
            TF_INIT_FLAGS="-input=false"

      - name: Plan
        run: |
          terraform -chdir=terraform plan \
            -input=false \
            -lock=false \
            -no-color
